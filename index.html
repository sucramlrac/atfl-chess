<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            width: 50px;
            height: 50px;
            border: solid 1px black;
            text-align: center;
        }

        .no-border {
            border: 0;
        }

    </style>
</head>
<body>
    <script>
        // const bt = document.createElement("button");
        // bt.id = "addChessboard";
        // bt.innerHTML = "Press to add chessboard";
        // bt.addEventListener("click", function(e) {
        //     createChessboard();
        // });
        // document.body.prepend(bt);

        function createChessboard() {
            const div = document.createElement("div");
            const table = document.createElement("table");
            const tr = document.createElement("tr");
            const th = document.createElement("th");
            const td = document.createElement("td");

            div.id = "chessboard";
    
            for(let i = 0; i < 9; i++) {
                tr.appendChild(td.cloneNode(true));
            }
    
            for(let i = 0; i < 9; i++) {
                table.appendChild(tr.cloneNode(true));
            }
            let i = 8;
            for (const row of table.children) {
                if (row.nextSibling === null) {
                    const letters = ["a","b","c","d","e","f","g","h"];
                    let j = 0;
                    for (const col of row.children) {
                        if (col.previousSibling === null) {
                            col.classList.add("no-border");
                            continue;
                        }
                        col.innerHTML = letters[j];
                        col.classList.add("no-border");
                        j++
                    }
                    break;
                } // checks if it is the last row
                row.firstElementChild.innerHTML = i;
                row.firstElementChild.classList.add("no-border");
                i--;
            }      
            
            div.appendChild(table);
            document.body.append(div);
        }

        // translate a string into the equivalent td element based on chess position notation
        function findPosition(position) {
            try {
                if (position.length > 2) {
                    throw new Error("Invalid position input string!");
                    return 0;
                }
            } catch (error) {
                console.error(`${error.name}: ${error.message}`);
            }
            const a = position.at(0).toLowerCase();
            const n = position.at(1);
            const letters = ["a","b","c","d","e","f","g","h"];
            const x = letters.indexOf(a) + 1;
            const y = n;

            const chessboard = document.getElementById("chessboard").firstChild;
            const pos = Array.from(chessboard.rows).map(row => Array.from(row.cells)); // create 2D array of the chessboard table element
            pos.reverse();


            return pos[y][x];
            // pos[y][x].style.backgroundColor = "blue";
            // console.log(chessboard);
            // console.log(a);
            // console.log(n);
            // console.log(pos);
        }
        
        createChessboard();
        console.log(findPosition("d2"));
    </script>
</body>
